name: SDD-Crash-Course Self-Diagnosis & OpenSpec CI Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-all-6-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20 & OpenSpec CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Run Master Self-Diagnosis Across All 6 Hands-On Labs
        run: |
          chmod +x ./self_diagnose_all.sh ./labs/*/self_diagnose.sh
          ./self_diagnose_all.sh
